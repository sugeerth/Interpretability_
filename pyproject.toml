[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-interp"
version = "0.1.0"
description = "Agentic interpretability: attribution, SAE features, model diffing and an investigation agent for open and API-only language models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.2", "transformers>=4.44", "safetensors", "huggingface_hub", "httpx>=0.27",
  "fastapi>=0.110", "uvicorn>=0.29", "anthropic>=1.0", "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyarrow"]

[project.scripts]
prism = "prism.cli:main"

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs Hugging Face / Neuronpedia access (deselect with -m 'not network')"]
