# Publishes the static demo (precomputed GPT-2 results) to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/build_static.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_static.py && rm dist/artifact.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
